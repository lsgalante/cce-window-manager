[package]
name = "cce-window-manager"
version = "0.1.0"
edition = "2021"

[lib]
name = "cce_window_manager"
path = "src/lib.rs"

[dependencies]
# The DE's ramp spec and its curve (`ramp.rs`), without cce-core's config half.
cce-core = { git = "https://github.com/lsgalante/cce-core.git", rev = "9f76297206c2b00e10b8f5f522f5966d40279957", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
