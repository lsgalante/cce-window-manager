[package]
name = "cce-window-manager"
version = "0.1.0"
edition = "2021"

[lib]
name = "cce_window_manager"
path = "src/lib.rs"

[dependencies]
# The DE's ramp spec and its curve (`ramp.rs`), without cce-core's config half.
cce-core = { git = "https://github.com/lsgalante/cce-core.git", rev = "5b8dcb30f1b0d7d607ab49d637069560eca0cb14", default-features = false }
log = "0.4"
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
serde_json = "1"
